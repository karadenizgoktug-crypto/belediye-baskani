name: Kurulum ve derleme

# proje.zip yüklenince: zip'i açar, dosyaları depoya işler, Android paketini (.aab) derler
# ve imzasız paketi bir "Release" olarak yayınlar (imzalama ayrıca yapılır).
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'proje.zip' ]

permissions:
  contents: write

jobs:
  kurulum:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: proje.zip dosyasını aç ve depoya işle
        run: |
          if [ -f proje.zip ]; then
            unzip -o -q proje.zip
            rm proje.zip
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "Proje dosyaları güncellendi (run ${{ github.run_number }})" || echo "Değişiklik yok"
            git push
          fi

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur ve oyunu Android projesine kopyala
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME  SDK=$ANDROID_SDK_ROOT"
          npm ci
          npx cap sync android

      - name: Google Play paketi (.aab) derle
        working-directory: android
        env:
          VERSION_CODE: ${{ github.run_number }}
        run: |
          chmod +x gradlew
          ./gradlew bundleRelease --no-daemon

      - name: İmzasız paketi Release olarak yayınla
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/bundle/release/app-release.aab belediye-baskani-imzasiz-${{ github.run_number }}.aab
          gh release create "derleme-${{ github.run_number }}" belediye-baskani-imzasiz-${{ github.run_number }}.aab \
            --title "Derleme ${{ github.run_number }}" \
            --notes "İmzasız Android paketi (versionCode ${{ github.run_number }}). Play'e yüklemeden önce yükleme anahtarıyla imzalanır." \
            --repo "${{ github.repository }}"
